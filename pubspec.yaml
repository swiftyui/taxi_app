name: TaxiApp
description: "WhatsApp Agent"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  google_fonts: ^8.2.1
  get: ^4.7.3
  flutter_localization: ^0.4.1
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  flutter_spinkit: ^5.2.2
  envied: ^1.3.8
  envied_generator: ^1.3.8
  google_maps_flutter: ^2.18.0
  permission_handler: ^13.0.1
  http: ^1.6.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
    - assets/images/
